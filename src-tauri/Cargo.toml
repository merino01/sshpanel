[package]
name = "sshpanel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSH Panel: gestor de archivos y terminal remotos para un VPS compartido"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sshpanel-core = { path = "../crates/core" }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-updater = "2.13.3"

[lib]
name = "sshpanel"
crate-type = ["staticlib", "cdylib", "rlib"]
