name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core-tests:
    name: Núcleo (pruebas contra OpenSSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sshpanel-core

  build:
    name: Compilar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias de Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Branding aplicado coincide con lo commiteado
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run branding
          git diff --exit-code src-tauri/tauri.conf.json ui/src/branding.generated.ts
      - run: npm run build
      - run: npx tauri build --no-bundle
